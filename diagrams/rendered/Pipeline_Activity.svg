<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" height="1063px" preserveAspectRatio="none" style="width:682px;height:1063px;background:#FFFFFF;" version="1.1" viewBox="0 0 682 1063" width="682px" zoomAndPan="magnify"><title>UML -&gt; MDH Bridge - Activity Diagram (the bridge's own logic)</title><defs/><g><text fill="#000000" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="495.5781" x="92.1357" y="32.9951">UML -&gt; MDH Bridge - Activity Diagram (the bridge's own logic)</text><ellipse cx="385.8843" cy="57.2969" fill="#222222" rx="10" ry="10" style="stroke:#222222;stroke-width:1;"/><rect fill="#F1F1F1" height="61.9063" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="289.4023" x="241.1831" y="87.2969"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="238.4648" x="251.1831" y="108.4355">Author UML activity diagram in Papyrus</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="269.4023" x="251.1831" y="122.4043">(SelectNode, CheckBounds, BoundsDecision,</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="259.6172" x="251.1831" y="136.373">ReadNeighbours, ApplyStencil, StoreValue)</text><rect fill="#F1F1F1" height="47.9375" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="273.2363" x="249.2661" y="169.2031"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="185.1914" x="259.2661" y="190.3418">Bridge parses poisson_dsc.uml</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="253.2363" x="259.2661" y="204.3105">and looks for the recognized node pattern</text><polygon fill="#F1F1F1" points="307.1763,237.1406,464.5923,237.1406,476.5923,249.9453,464.5923,262.75,307.1763,262.75,295.1763,249.9453,307.1763,237.1406" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="145.1538" x="307.1763" y="247.3511">all required nodes present</text><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="157.416" x="307.1763" y="260.1558">with the expected xmi:type?</text><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="19.0083" x="276.168" y="247.3511">yes</text><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="13.7017" x="476.5923" y="247.3511">no</text><rect fill="#F1F1F1" height="33.9688" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="194.4863" x="118.4287" y="272.75"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="174.4863" x="128.4287" y="293.8887">Map SelectNode -&gt; L(1), L(2)</text><rect fill="#F1F1F1" height="47.9375" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="260.9727" x="85.1855" y="340.6875"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="240.9727" x="95.1855" y="361.8262">Map ReadNeighbours (top/bot/left/right)</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="190.9512" x="95.1855" y="375.7949">-&gt; 5-point stencil neighborhood</text><rect fill="#F1F1F1" height="33.9688" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="294.7871" x="68.2783" y="408.625"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="274.7871" x="78.2783" y="429.7637">Map ApplyStencil formula -&gt; scalar_function f</text><rect fill="#F1F1F1" height="33.9688" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="409.3438" x="11" y="462.5938"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="389.3438" x="21" y="483.7324">Map StoreValue, no reduce loop -&gt; result_buffer, md_hom&lt;2,0&gt;</text><rect fill="#F1F1F1" height="33.9688" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="251.3574" x="89.9932" y="516.5625"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="231.3574" x="99.9932" y="537.7012">Emit generated/poisson_from_uml.cpp</text><rect fill="#F1F1F1" height="33.9688" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="283.8184" x="73.7627" y="570.5313"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="263.8184" x="83.7627" y="591.6699">cmake &amp;&amp; make -&gt; build/poisson_from_uml</text><rect fill="#F1F1F1" height="33.9688" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="298.2617" x="66.541" y="624.5"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="278.2617" x="76.541" y="645.6387">Run executable -&gt; poisson_1.cu, poisson_2.cu</text><rect fill="#F1F1F1" height="33.9688" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="350.1055" x="40.6191" y="678.4688"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="330.1055" x="50.6191" y="699.6074">Compile benchmarks (nvcc) with matching tile -D flags</text><rect fill="#F1F1F1" height="33.9688" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="255.7168" x="87.8135" y="732.4375"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="235.7168" x="97.8135" y="753.5762">Run Serial Jacobi (CPU) to convergence</text><rect fill="#F1F1F1" height="33.9688" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="292.3496" x="69.4971" y="786.4063"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="272.3496" x="79.4971" y="807.5449">Run MDH-tuned kernel (GPU) to convergence</text><rect fill="#F1F1F1" height="47.9375" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="292.6953" x="69.3242" y="840.375"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="272.6953" x="79.3242" y="861.5137">Run MDA naive kernel (GPU) to convergence,</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="214.6641" x="79.3242" y="875.4824">same serial baseline, same harness</text><rect fill="#F1F1F1" height="47.9375" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="238.6367" x="96.3535" y="908.3125"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="218.6367" x="106.3535" y="929.4512">Compare iteration counts, residuals,</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="158.1445" x="106.3535" y="943.4199">max diff, and kernel times</text><rect fill="#F1F1F1" height="33.9688" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="284.75" x="73.2969" y="976.25"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="264.75" x="83.2969" y="997.3887">Record 3-way speedup table in README.md</text><rect fill="#F1F1F1" height="47.9375" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="231.5059" x="440.3438" y="272.75"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="152.4785" x="450.3438" y="293.8887">Abort with a clear error --</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="211.5059" x="450.3438" y="307.8574">the bridge refuses to guess silently</text><ellipse cx="556.0967" cy="364.6563" fill="none" rx="10" ry="10" style="stroke:#222222;stroke-width:1.5;"/><line style="stroke:#222222;stroke-width:2.5